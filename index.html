<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo/springmanga.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPRINGMANGA</title>

    <style>
      /* ═══════════════════════════════════════════════════════════
         SPRINGMANGA — "Techno-Organic Decay" Palette
         Springtrap-inspired horror aesthetic
         ═══════════════════════════════════════════════════════════ */
      :root {
        --c-base: #121212;
        --c-surface: #1A1A1A;
        --c-surface-hover: #252520;
        --c-overlay: #3D2B1F;
        --c-muted: #8a8a7a;
        --c-subtle: #5c5c50;
        --c-text-primary: #E0E0E0;
        --c-text-secondary: #B0B0A0;
        --c-brand: #7A8755;
        --c-brand-hover: #6B7A48;
        --c-brand-accent: #A9FF00;
        /* RGB channels for opacity utilities */
        --c-base-rgb: 18 18 18;
        --c-surface-rgb: 26 26 26;
        --c-surface-hover-rgb: 37 37 32;
        --c-overlay-rgb: 61 43 31;
        --c-text-primary-rgb: 224 224 224;
        --c-text-secondary-rgb: 176 176 160;
        --c-brand-rgb: 122 135 85;
        --c-brand-hover-rgb: 107 122 72;
        --c-brand-accent-rgb: 169 255 0;
        --c-muted-rgb: 138 138 122;

        /* Extra Springtrap tokens */
        --c-rust: #3D2B1F;
        --c-toxic: #A9FF00;
        --c-warning: #D4AF37;
        --c-error: #A9FF00;
        --c-reader-bg: #0F0F0F;

        /* ═══ SpringOS Admin Palette ═══ */
        --spring-base: #11100F;
        --spring-surface: #241e1a;
        --spring-surface-hover: #2e2620;
        --spring-overlay: #3a3028;
        --spring-muted: #7a7060;
        --spring-subtle: #5a5040;
        --spring-text: #d4c8b0;
        --spring-text-secondary: #a09880;
        --spring-mustard: #9b8c3b;
        --spring-mustard-rgb: 155 140 59;
        --spring-springtrap-green: #5a6638;
        --spring-springtrap-green-rgb: 90 102 56;
        --spring-blood: #7a1616;
        --spring-blood-rgb: 122 22 22;
        --spring-glow: #39ff14;
        --spring-glow-rgb: 57 255 20;
        --spring-danger: #7a1616;
        --spring-danger-rgb: 122 22 22;
      }

      /* ═══ Light Theme ═══ */
      .light {
        --c-base: #F5F5F0;
        --c-surface: #FFFFFF;
        --c-surface-hover: #EAEAE5;
        --c-overlay: #D0C8B8;
        --c-muted: #8A8A7A;
        --c-subtle: #A0A090;
        --c-text-primary: #1A1A1A;
        --c-text-secondary: #4A4A40;
        --c-brand: #5A6B38;
        --c-brand-hover: #4A5A2E;
        --c-brand-accent: #6B8F00;
        --c-base-rgb: 245 245 240;
        --c-surface-rgb: 255 255 255;
        --c-surface-hover-rgb: 234 234 229;
        --c-overlay-rgb: 208 200 184;
        --c-text-primary-rgb: 26 26 26;
        --c-text-secondary-rgb: 74 74 64;
        --c-brand-rgb: 90 107 56;
        --c-brand-hover-rgb: 74 90 46;
        --c-brand-accent-rgb: 107 143 0;
        --c-muted-rgb: 138 138 122;
        --c-rust: #D0C8B8;
        --c-toxic: #6B8F00;
        --c-warning: #B8960A;
        --c-error: #CC3300;
        --c-reader-bg: #FAFAF5;
      }

      /* Remove scanline overlay in light mode */
      html.light body::after {
        display: none !important;
      }

      /* Softer scrollbar in light mode */
      html.light ::-webkit-scrollbar-track {
        background: #F5F5F0;
        border-left: 1px solid #D0C8B8;
      }
      html.light ::-webkit-scrollbar-thumb {
        background: #5A6B38;
      }
      html.light ::selection {
        background: #6B8F00;
        color: #fff;
      }

      /* ── Scanline overlay ── */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(169, 255, 0, 0.015) 2px,
          rgba(169, 255, 0, 0.015) 4px
        );
      }

      /* ── Flicker animation ── */
      @keyframes springFlicker {
        0%   { opacity: 1; }
        10%  { opacity: 0.88; }
        20%  { opacity: 1; }
        50%  { opacity: 0.92; }
        60%  { opacity: 1; }
        80%  { opacity: 0.85; }
        100% { opacity: 1; }
      }
      .spring-flicker:hover {
        animation: springFlicker 0.4s ease-in-out;
      }

      /* ── Toxic glow on hover ── */
      @keyframes toxicPulse {
        0%, 100% { box-shadow: 0 0 4px rgba(169, 255, 0, 0.2); }
        50%      { box-shadow: 0 0 16px rgba(169, 255, 0, 0.45); }
      }
      .toxic-glow:hover {
        box-shadow: 0 0 12px rgba(169, 255, 0, 0.35);
      }
      .toxic-glow-pulse:hover {
        animation: toxicPulse 1.5s ease-in-out infinite;
      }

      /* ── Rusty decay border (uneven corners) ── */
      .decay-border {
        border-radius: 4px 12px 6px 14px;
        border: 1px solid #3D2B1F;
        background: linear-gradient(135deg, #1A1A1A 0%, #1E1E18 100%);
      }

      /* ── Glitch text effect ── */
      @keyframes glitchText {
        0%   { text-shadow: 2px 0 #A9FF00, -2px 0 #3D2B1F; }
        25%  { text-shadow: -2px 0 #A9FF00, 2px 0 #3D2B1F; }
        50%  { text-shadow: 0 0 #A9FF00, 0 0 #3D2B1F; }
        75%  { text-shadow: 1px -1px #A9FF00, -1px 1px #3D2B1F; }
        100% { text-shadow: 0 0 #A9FF00, 0 0 #3D2B1F; }
      }
      .glitch-text:hover {
        animation: glitchText 0.3s steps(4) 1;
      }

      /* ── System Failure error style ── */
      .system-failure {
        color: #A9FF00;
        border: 1px solid #A9FF00;
        background: rgba(169, 255, 0, 0.05);
        font-family: 'Courier New', monospace;
      }
    </style>

    <!-- Tailwind is now compiled via PostCSS (npm build), no CDN needed -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;700&family=VT323&family=Fira+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body class="bg-base text-text-primary">
    <script>
      // Restore saved theme
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
