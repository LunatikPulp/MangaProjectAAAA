server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # React frontend (static build)
    root /opt/manga/frontend/dist;
    index index.html;

    # API proxy to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # User uploads (avatars, banners, etc.)
    location /uploads/ {
        alias /opt/manga/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Manga chapter images
    location /static/ {
        alias /opt/manga/backend/manga/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Avatar frames
    location /Frames/ {
        alias /opt/manga/frontend/dist/Frames/;
        expires 30d;
    }

    # Achievement icons
    location "/Achievement Icons/" {
        alias "/opt/manga/frontend/dist/Achievement Icons/";
        expires 30d;
    }

    # React SPA fallback - all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
