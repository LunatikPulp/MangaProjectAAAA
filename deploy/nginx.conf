# NOTE: This file is the initial HTTP-only config used BEFORE running certbot.
# After certbot --nginx, it gets replaced with nginx_manga.conf (HTTPS + Brotli).
# If you already have HTTPS, use nginx_manga.conf instead.

server {
    listen 80;
    server_name springmanga.duckdns.org;

    client_max_body_size 50M;

    root /opt/manga/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        alias /opt/manga/backend/uploads/;
        expires 7d;
    }

    location /static/ {
        alias /opt/manga/backend/manga/;
        expires 30d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
