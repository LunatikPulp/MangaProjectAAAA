server {
    listen 80;
    server_name springmanga.duckdns.org;

    client_max_body_size 50M;

    root /opt/manga/frontend/dist;
    index index.html;

    # Image proxy with nginx cache layer
    location /api/proxy/image {
        proxy_pass http://127.0.0.1:8000/proxy/image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        proxy_cache imgcache;
        proxy_cache_valid 200 7d;
        proxy_cache_key "$uri?$args";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=604800";
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # User uploads (avatars, banners, etc.)
    location /uploads/ {
        alias /opt/manga/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Manga images
    location /static/ {
        alias /opt/manga/backend/manga/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxied image cache
    location /image_cache/ {
        alias /opt/manga/backend/image_cache/;
        expires 30d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Frontend static assets (avatar frames)
    location /Frames/ {
        alias /opt/manga/frontend/dist/Frames/;
        expires 30d;
    }

    location "/Achievement Icons/" {
        alias "/opt/manga/frontend/dist/Achievement Icons/";
        expires 30d;
    }

    # Hashed JS/CSS chunks — cache forever (filename changes on content change)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
