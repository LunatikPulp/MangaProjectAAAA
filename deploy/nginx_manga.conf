server {
    server_name springmanga.duckdns.org;

    client_max_body_size 50M;

    root /opt/manga/frontend/dist;
    index index.html;

    # ── Image proxy with nginx cache layer ──
    location /api/proxy/image {
        proxy_pass http://127.0.0.1:8000/proxy/image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        proxy_cache imgcache;
        proxy_cache_valid 200 7d;
        proxy_cache_key "$uri?$args";
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Backend API — GZip by nginx (no Brotli on-the-fly for dynamic) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── User uploads ──
    location /uploads/ {
        alias /opt/manga/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Manga images ──
    location /static/ {
        alias /opt/manga/backend/manga/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /image_cache/ {
        alias /opt/manga/backend/image_cache/;
        expires 30d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /Frames/ {
        alias /opt/manga/frontend/dist/Frames/;
        expires 30d;
    }

    location "/Achievement Icons/" {
        alias "/opt/manga/frontend/dist/Achievement Icons/";
        expires 30d;
    }

    # ── Hashed JS/CSS — Brotli pre-compressed + cache forever ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        brotli_static on;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
        brotli_static on;
    }

    # SSL managed by Certbot — run: certbot --nginx -d springmanga.duckdns.org
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/springmanga.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/springmanga.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect
server {
    if ($host = springmanga.duckdns.org) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name springmanga.duckdns.org;
    return 404;
}
