# Add these blocks to /etc/nginx/nginx.conf inside the http {} block.
# They apply globally to all sites on the server.

# ── Gzip ──
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

# ── Brotli (requires libnginx-mod-http-brotli-filter) ──
brotli on;
brotli_comp_level 6;
brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# ── Image proxy cache zone ──
proxy_cache_path /var/cache/nginx/proxy levels=1:2 keys_zone=imgcache:10m max_size=500m inactive=7d use_temp_path=off;
