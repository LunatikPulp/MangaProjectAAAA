# Add these blocks to /etc/nginx/nginx.conf inside the http {} block.
# They apply globally to all sites on the server.

# ── Gzip: for dynamic API responses (faster to encode than Brotli) ──
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types text/plain text/css application/json application/javascript
           text/xml application/xml application/xml+rss text/javascript;

# ── Brotli: ONLY static pre-compressed files (requires libnginx-mod-http-brotli-static) ──
# brotli filter (on-the-fly) is intentionally NOT enabled — too CPU-heavy for dynamic content.
# Vite generates .br files at build time; nginx serves them with zero CPU cost.
brotli_static on;

# ── Image proxy cache zone ──
proxy_cache_path /var/cache/nginx/proxy levels=1:2 keys_zone=imgcache:10m max_size=500m inactive=7d use_temp_path=off;
